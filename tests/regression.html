<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>BCTR regression</title>
<style>
  body { margin: 0; font-family: sans-serif; }
  #mirror-vdcon { display: flex; width: 100vw; height: 100vh; }
  .left-container { flex: 1; min-width: 0; }
  .right-container { width: 25%; flex: 0 0 25%; min-width: 0; }
  #playerWrap, #commentapp { height: 100%; }
  #playerWrap { background: #111; }
  #commentapp { overflow-y: auto; background: #fff; }
  bili-comments { display: block; height: 1400px; }
  .video-info-container, .video-desc-container, .video-tag-container,
  .up-panel-container, .video-pod, .recommend-list-v1 { padding: 12px; }
  #results { position: fixed; left: 8px; top: 8px; z-index: 2147483647; background: #fff; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="mirror-vdcon"></div>
<pre id="results">running</pre>
<script>
  const params = new URLSearchParams(location.search);
  const testCase = params.get('case') || 'history-first';
  const introMode = testCase === 'intro-lazy';
  const lazyScroll = testCase === 'lazy-scroll';
  const legacyMove = params.get('legacyMove') === '1';
  if (legacyMove) delete Element.prototype.moveBefore;
  const results = [];
  const startedAt = performance.now();
  let scrollEvents = 0;
  let commentScrollHeightReads = 0;
  const scrollHeightDescriptor = Object.getOwnPropertyDescriptor(Element.prototype, 'scrollHeight');
  Object.defineProperty(Element.prototype, 'scrollHeight', {
    configurable: true,
    get() {
      if (this.id === 'commentapp') commentScrollHeightReads++;
      return scrollHeightDescriptor.get.call(this);
    }
  });

  Object.defineProperty(document, 'hidden', { configurable: true, get: () => false });
  Object.defineProperty(document, 'visibilityState', { configurable: true, get: () => 'visible' });
  window.requestAnimationFrame = (callback) => {
    queueMicrotask(() => callback(performance.now()));
    return 0;
  };
  window.cancelAnimationFrame = () => {};
  window.GM_getValue = (key, fallback) => {
    if (key === 'rememberTab' && introMode) return true;
    if (key === 'activeTab' && introMode) return 'intro';
    return fallback;
  };
  window.GM_setValue = () => {};
  window.GM_registerMenuCommand = () => {};
  document.addEventListener('scroll', (event) => {
    if (event.target.id === 'commentapp') scrollEvents++;
  }, true);
  document.addEventListener('keydown', (event) => {
    if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
    const video = document.querySelector('video');
    if (!video) return;
    event.preventDefault();
    video.dataset.currentTime = String(Math.max(0, Number(video.dataset.currentTime || 0) + (event.key === 'ArrowRight' ? 5 : -5)));
  });
</script>
<script src="/bilibili-client-layout.user.js?v=regression"></script>
<script>
  class FixtureComments extends HTMLElement {
    constructor() {
      super();
      this.dataset.connects = '0';
      this.dataset.disconnects = '0';
      if (lazyScroll) {
        this.showContinueTrigger = true;
        this.updateComplete = new Promise((resolve) => { this.finishUpdate = resolve; });
        this.mode = 3;
        this.list = [];
        this.paginationStr = '0';
        this.showEnd = false;
        this.showSpinner = false;
        this.showContinuations = false;
        this.dataset.getListCalls = '0';
      }
    }
    get continueTrigger() {
      return lazyScroll ? this.shadowRoot?.querySelector('.trigger') : null;
    }
    addLoadEvent() {
      if (lazyScroll) this.dataset.loadBound = this.continueTrigger ? 'trigger' : 'window';
    }
    async getList() {
      if (!lazyScroll) return;
      const initiallyLoading = this.showSpinner;
      this.dataset.getListCalls = String(Number(this.dataset.getListCalls) + 1);
      this.paginationStr = String(Number(this.paginationStr) + 1);
      this.showSpinner = true;
      await new Promise((resolve) => setTimeout(resolve, 5));
      if (this.mode === 3 && Number(this.dataset.getListCalls) >= 6) this.list.push({ rpid_str: String(this.dataset.getListCalls) });
      if (Number(this.dataset.getListCalls) === 1) {
        setTimeout(() => { this.dataset.continuationsDuringDelay = String(this.showContinuations); }, 60);
      }
      if (!initiallyLoading) this.showSpinner = false;
    }
    connectedCallback() {
      this.dataset.connects = String(Number(this.dataset.connects) + 1);
      if (lazyScroll) this.addLoadEvent();
      if (this.shadowRoot) return;
      const root = this.attachShadow({ mode: 'open' });
      if (lazyScroll) {
        queueMicrotask(() => {
          root.innerHTML = '<div class="trigger"></div>';
          this.finishUpdate();
        });
        return;
      }
      root.innerHTML = '<bili-comment-thread-renderer></bili-comment-thread-renderer>';
    }
    disconnectedCallback() {
      this.dataset.disconnects = String(Number(this.dataset.disconnects) + 1);
    }
  }
  class FixtureThread extends HTMLElement {
    connectedCallback() {
      if (this.shadowRoot) return;
      const root = this.attachShadow({ mode: 'open' });
      root.innerHTML = '<bili-comment-renderer></bili-comment-renderer>';
    }
  }
  class FixtureComment extends HTMLElement {
    connectedCallback() {
      if (this.shadowRoot) return;
      const root = this.attachShadow({ mode: 'open' });
      root.innerHTML = '<bili-comment-action-buttons-renderer></bili-comment-action-buttons-renderer>';
    }
  }
  class FixtureActions extends HTMLElement {
    constructor() {
      super();
      this._showMoreMenu = false;
    }
    set showMoreMenu(value) {
      this._showMoreMenu = value;
      this.dataset.menuOpen = String(value);
    }
    get showMoreMenu() { return this._showMoreMenu; }
    connectedCallback() {
      if (this.shadowRoot) return;
      const root = this.attachShadow({ mode: 'open' });
      root.innerHTML = '<div id="more"><button id="trigger">...</button><bili-comment-menu></bili-comment-menu></div><button id="reply">回复</button>';
      root.querySelector('#trigger').addEventListener('click', () => { this.showMoreMenu = true; });
    }
  }
  customElements.define('bili-comments', FixtureComments);
  customElements.define('bili-comment-thread-renderer', FixtureThread);
  customElements.define('bili-comment-renderer', FixtureComment);
  customElements.define('bili-comment-action-buttons-renderer', FixtureActions);
  customElements.define('bili-comment-menu', class extends HTMLElement {});

  function shellHtml(name, slowComment) {
    return `
      <div class="left-container">
        <div id="playerWrap"><div class="bpx-player-container" data-screen="normal"><video></video></div></div>
        <div class="video-info-container"><h1>${name} title</h1></div>
        <div id="arc_toolbar_report"><div class="video-toolbar-right"></div></div>
        <div class="video-desc-container">${name} description</div>
        <div class="video-tag-container">tags</div>
        <div id="commentapp">${slowComment ? '' : '<bili-comments></bili-comments>'}</div>
      </div>
      <div class="right-container"><div class="right-container-inner">
        <div class="up-panel-container">UP ${name}</div>
        <div class="video-pod">playlist ${name}</div>
        <div class="recommend-list-v1">recommend ${name}</div>
      </div></div>`;
  }

  function resetShell(name, slowComment = false) {
    document.querySelector('#mirror-vdcon').innerHTML = shellHtml(name, slowComment);
    if (slowComment) {
      const app = document.querySelector('#mirror-vdcon #commentapp');
      setTimeout(() => {
        if (app.isConnected && !app.firstElementChild) app.appendChild(document.createElement('bili-comments'));
      }, 800);
    }
  }

  function reuseShell(name) {
    document.querySelector('.video-info-container h1').textContent = name + ' title';
    document.querySelector('.video-desc-container').textContent = name + ' description';
    document.querySelector('.up-panel-container').textContent = 'UP ' + name;
    document.querySelector('.video-pod').textContent = 'playlist ' + name;
    document.querySelector('.recommend-list-v1').textContent = 'recommend ' + name;
  }

  function pushRoute(name) {
    history.pushState({}, '', '/video/' + name + '/');
  }

  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  const panelApps = () => Array.from(document.querySelectorAll('#bctr-tab-comment #commentapp'));
  const allApps = () => Array.from(document.querySelectorAll('#commentapp'));
  const leftApp = () => document.querySelector('#mirror-vdcon #commentapp');
  const assert = (condition, message, details) => {
    results.push({ name: message, pass: !!condition, details });
    if (!condition) throw new Error(message);
  };
  const waitFor = async (predicate, timeout = 1500) => {
    const start = performance.now();
    while (!predicate()) {
      if (performance.now() - start >= timeout) throw new Error('waitFor timeout');
      await wait(10);
    }
  };
  const finish = () => {
    const payload = { case: testCase, pass: results.every((item) => item.pass), durationMs: Math.round(performance.now() - startedAt), results };
    document.body.dataset.result = JSON.stringify(payload);
    document.querySelector('#results').textContent = JSON.stringify(payload, null, 2);
  };

  async function runHistoryFirst() {
    const oldApp = panelApps()[0];
    let mountedAt = 0;
    let movedAt = 0;
    const observer = new MutationObserver((records) => {
      const app = leftApp();
      if (app && app.querySelector('bili-comments') && !mountedAt) mountedAt = performance.now();
      for (const record of records) {
        if (record.target.id !== 'bctr-tab-comment') continue;
        for (const node of record.addedNodes) {
          if (node.id === 'commentapp' && node !== oldApp && !movedAt) movedAt = performance.now();
        }
      }
    });
    observer.observe(document.documentElement, { childList: true, subtree: true });
    pushRoute('BVHISTORY');
    window.dispatchEvent(new PopStateEvent('popstate'));
    await wait(50);
    resetShell('BVHISTORY', true);
    await wait(120);
    assert(panelApps().length === 0, 'history-first: old panel comment removed before new comment mounts');
    assert(!!leftApp() && !leftApp().querySelector('bili-comments'), 'history-first: empty shell comment stays in place');
    assert(!document.querySelector('#bctr-tab-intro .video-info-container'), 'history-first: intro nodes wait for hydration');
    assert(document.querySelectorAll('.bctr-wait-hint').length > 0, 'history-first: loading hint remains visible');
    await waitFor(() => movedAt > 0);
    observer.disconnect();
    assert(allApps().length === 1 && panelApps().length === 1, 'history-first: exactly one comment container after ready');
    assert(!oldApp.isConnected, 'history-first: old comment node disconnected');
    assert(!!document.querySelector('#bctr-tab-intro .video-info-container'), 'history-first: intro moves after hydration');
    assert(movedAt - mountedAt < 250, 'history-first: ready comment moves promptly', { delayMs: Math.round(movedAt - mountedAt) });
  }

  async function runHintReuse() {
    pushRoute('BVHINT1');
    window.dispatchEvent(new PopStateEvent('popstate'));
    await wait(50);
    resetShell('BVHINT1', true);
    await waitFor(() => !!document.querySelector('#bctr-tab-comment .bctr-wait-hint'));
    const hint = document.querySelector('#bctr-tab-comment .bctr-wait-hint');
    pushRoute('BVHINT2');
    window.dispatchEvent(new PopStateEvent('popstate'));
    await wait(50);
    resetShell('BVHINT2', true);
    await wait(50);
    assert(document.querySelector('#bctr-tab-comment .bctr-wait-hint') === hint, 'hint-reuse: waiting hint node survives route reset');
  }

  async function runDomFirst() {
    const oldApp = panelApps()[0];
    pushRoute('BVDOM');
    resetShell('BVDOM');
    await waitFor(() => panelApps().length === 1 && panelApps()[0] !== oldApp && panelApps()[0].querySelector('bili-comments'));
    assert(allApps().length === 1, 'dom-first: no duplicate comment container');
    assert(document.querySelector('#bctr-tab-intro .video-info-container h1').textContent === 'BVDOM title', 'dom-first: new intro loaded');
  }

  async function runReuse() {
    const oldApp = panelApps()[0];
    pushRoute('BVREUSE');
    reuseShell('BVREUSE');
    await wait(400);
    assert(panelApps()[0] === oldApp, 'reuse: same comment node preserved');
    oldApp.dispatchEvent(new Event('scroll'));
    await Promise.resolve();
    const readsBeforeScroll = commentScrollHeightReads;
    oldApp.dispatchEvent(new Event('scroll'));
    await Promise.resolve();
    assert(commentScrollHeightReads === readsBeforeScroll, 'reuse: pure scroll reuses scrollbar geometry', { reads: commentScrollHeightReads - readsBeforeScroll });
    oldApp.scrollTop = 120;
    await wait(5300);
    assert(oldApp.scrollTop === 120, 'reuse: health check preserves comment scroll', { scrollTop: oldApp.scrollTop });
    assert(allApps().length === 1, 'reuse: one comment container');
    assert(document.querySelector('#bctr-tab-intro .video-info-container h1').textContent === 'BVREUSE title', 'reuse: new title loaded');
  }

  async function runIntroLazy() {
    assert(document.querySelector('.bctr-tab.active').dataset.tab === 'intro', 'intro-lazy: starts on intro tab');
    const oldApp = panelApps()[0];
    pushRoute('BVINTRO');
    resetShell('BVINTRO', true);
    await waitFor(() => panelApps().length === 1 && panelApps()[0] !== oldApp && panelApps()[0].querySelector('bili-comments'), 3000);
    await wait(100);
    const before = scrollEvents;
    document.querySelector('.bctr-tab[data-tab="comment"]').click();
    await wait(150);
    assert(scrollEvents > before, 'intro-lazy: switching to visible comment triggers lazy load', { before, after: scrollEvents });
  }

  async function runLazyScroll() {
    const comments = document.querySelector('bili-comments');
    await waitFor(() => !!comments.dataset.loadBound);
    assert(comments.dataset.loadBound === 'trigger', 'lazy-scroll: native continuation observer waits for the rendered trigger', {
      loadBound: comments.dataset.loadBound
    });
    await comments.getList();
    assert(comments.dataset.getListCalls === '6' && comments.list.length === 1, 'lazy-scroll: empty hot pages retry up to five times through native getList', {
      calls: comments.dataset.getListCalls,
      listLength: comments.list.length
    });
    assert(comments.dataset.continuationsDuringDelay === 'true', 'lazy-scroll: native loading indicator stays visible between retries', {
      continuationsDuringDelay: comments.dataset.continuationsDuringDelay
    });
    comments.mode = 3;
    comments.list = [];
    comments.paginationStr = '0';
    comments.showEnd = false;
    comments.showContinuations = false;
    comments.showSpinner = true;
    comments.__bctrEmptyHotRetries = 0;
    await comments.getList();
    assert(comments.dataset.getListCalls === '7' && comments.showSpinner, 'lazy-scroll: initial loading does not start empty-page retries', {
      calls: comments.dataset.getListCalls,
      spinner: comments.showSpinner
    });
    comments.showSpinner = false;
    comments.mode = 2;
    comments.list = [];
    comments.paginationStr = '0';
    comments.__bctrEmptyHotRetries = 0;
    await comments.getList();
    assert(comments.dataset.getListCalls === '8' && comments.list.length === 0 && comments.__bctrEmptyHotRetries === 0, 'lazy-scroll: latest mode keeps native single-request behavior', {
      calls: comments.dataset.getListCalls,
      listLength: comments.list.length,
      retries: comments.__bctrEmptyHotRetries
    });
  }

  async function runBasic() {
    assert(document.querySelectorAll('#bctr-panel').length === 1, 'basic: panel exists');
    assert(allApps().length === 1 && panelApps().length === 1, 'basic: one comment container');
    const commentApp = allApps()[0];
    const comments = commentApp.querySelector('bili-comments');
    const expectedConnects = legacyMove ? ['2', '3', '4'] : ['1', '1', '1'];
    const expectedDisconnects = legacyMove ? ['1', '2', '3'] : ['0', '0', '0'];
    assert(comments.dataset.connects === expectedConnects[0] && comments.dataset.disconnects === expectedDisconnects[0], 'basic: moving comments uses the expected lifecycle', {
      connects: comments.dataset.connects,
      disconnects: comments.dataset.disconnects
    });
    const toggle = document.querySelector('.comment-toggle-btn');
    toggle.click();
    await waitFor(() => leftApp() === commentApp);
    assert(comments.dataset.connects === expectedConnects[1] && comments.dataset.disconnects === expectedDisconnects[1], 'basic: restoring comments uses the expected lifecycle');
    toggle.click();
    await waitFor(() => panelApps()[0] === commentApp);
    assert(comments.dataset.connects === expectedConnects[2] && comments.dataset.disconnects === expectedDisconnects[2], 'basic: moving comments again uses the expected lifecycle');
    document.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true, cancelable: true }));
    assert(document.querySelector('video').dataset.currentTime === '5', 'basic: arrow key seeks video');
    assert(document.querySelector('.bctr-tab.active').dataset.tab === 'comment', 'basic: arrow key keeps comment tab');
    const video = document.querySelector('video');
    video.volume = 0.5;
    const playerWheel = new WheelEvent('wheel', { deltaY: -100, bubbles: true, cancelable: true });
    document.querySelector('#playerWrap').dispatchEvent(playerWheel);
    assert(video.volume > 0.5 && playerWheel.defaultPrevented, 'basic: player wheel adjusts volume');
    const volumeAfterWheel = video.volume;
    const commentWheel = new WheelEvent('wheel', { deltaY: 100, bubbles: true, cancelable: true });
    allApps()[0].dispatchEvent(commentWheel);
    assert(video.volume === volumeAfterWheel && !commentWheel.defaultPrevented, 'basic: comment wheel is left alone');
    const actions = document.querySelector('bili-comments').shadowRoot
      .querySelector('bili-comment-thread-renderer').shadowRoot
      .querySelector('bili-comment-renderer').shadowRoot
      .querySelector('bili-comment-action-buttons-renderer');
    actions.shadowRoot.querySelector('#trigger').click();
    assert(actions.dataset.menuOpen === 'true', 'basic: native comment menu opens');
    document.querySelector('#playerWrap').dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, composed: true }));
    document.querySelector('#playerWrap').click();
    assert(actions.dataset.menuOpen === 'false', 'basic: comment menu closes on outside pointer');
    document.querySelector('#playerWrap').remove();
    await wait(1100);
    const player = document.createElement('div');
    player.id = 'playerWrap';
    player.innerHTML = '<div class="bpx-player-container" data-screen="normal"><video></video></div>';
    document.querySelector('.left-container').prepend(player);
    await wait(1100);
    assert(document.querySelectorAll('#bctr-panel').length === 1 && document.querySelectorAll('#playerWrap').length === 1, 'basic: layout recovers after player reinsert');
    const upPanel = document.querySelector('#bctr-tab-intro .up-panel-container');
    upPanel.remove();
    await waitFor(() => document.querySelector('#bctr-tab-intro .up-panel-container') === upPanel, 2500);
    assert(document.querySelector('#bctr-tab-intro .up-panel-container') === upPanel, 'basic: healer restores a detached native node');
  }

  resetShell('video-A');
  history.replaceState({}, '', '/video/BVINITIAL/');
</script>
<script>
  (async () => {
    try {
      await waitFor(() => !!document.querySelector('#bctr-panel'), 3000);
      if (testCase === 'history-first') await runHistoryFirst();
      else if (testCase === 'hint-reuse') await runHintReuse();
      else if (testCase === 'dom-first') await runDomFirst();
      else if (testCase === 'reuse') await runReuse();
      else if (testCase === 'intro-lazy') await runIntroLazy();
      else if (testCase === 'lazy-scroll') await runLazyScroll();
      else await runBasic();
    } catch (error) {
      results.push({ name: 'unexpected', pass: false, details: error.message });
    } finally {
      finish();
    }
  })();
</script>
</body>
</html>
